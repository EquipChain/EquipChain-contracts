[package]
name = "utility_contracts"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[features]
# Gate pre-existing test modules that need API migration (soroban-sdk 23.x).
# Enable with: cargo test --features full-tests
full-tests = []

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
proptest = "1.4"
lazy_static = "1.4"